# Ambiente de desenvolvimento local completo (BUG-05)
# Sobe: PostgreSQL + Backend (porta 3000) + Frontend Vite (porta 5173)
# Hot-reload via volumes + nodemon/vite.

services:
  db:
    image: postgres:15-alpine
    container_name: validevento-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: validevento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d validevento"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    container_name: validevento-backend
    restart: always
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm install --no-audit --no-fund; npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/validevento
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: validevento-frontend
    restart: always
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm install --no-audit --no-fund; npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
